[lines]
room_cleared = "The frost on the vault door does not crack. Whatever you changed, you changed on purpose."
room_failed = "Somewhere in the vault a weight shifts that should not have. The trial noticed."
boss_intro = "A pale thing drifts between the shelves, touching checkpoints. Where its fingers pass, the models forget. It smiles: 'Teach them anything you like. I will keep what they lose.'"
boss_defeated = "The Forgetter reaches for the chronicles and finds them still there, under the ice, behind a sigil it cannot read. It fades."
floor_cleared = "The vault is yours: frozen base, swappable sigils, merged exports. Below, a library answers every question, whether or not it has the book."

