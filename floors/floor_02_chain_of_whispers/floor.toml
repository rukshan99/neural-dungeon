[[loot]]
name = "Grimoire of Derivatives"
file = "loot/derivatives_grimoire.md"
blurb = "Every local derivative you wrote on this floor, the unbroadcast rule, the topological-sort recipe, the accumulation gotchas, and why fifty small numbers multiply to nothing."

[[loot]]
