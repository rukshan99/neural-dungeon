[lines]
room_cleared = "The metal rings true. The smith nods once and turns back to the fire."
room_failed = "The blade cracks on the anvil. Check the shapes, check the gradient, strike again."
boss_intro = "Something in the lair is counting your training examples out loud. It has a head for each one it remembers, and it remembers everything."
