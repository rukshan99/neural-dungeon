name: trials

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    name: solutions pass, stubs fail (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check .

      - name: Doctor
        run: dungeon doctor

      - name: Every floor manifest is consistent
        run: python scripts/lint_floors.py

      - name: Every trial passes against the reference solutions
        env:
          DUNGEON_SOLUTIONS: "1"
          NO_COLOR: "1"
        run: pytest floors -q -p no:cacheprovider

      - name: Every trial fails against the untouched stubs
        env:
          NO_COLOR: "1"
        run: python scripts/check_stubs_fail.py
